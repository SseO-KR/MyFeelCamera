org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP Gradle 플러그인이 아직 AGP 9 내장 Kotlin의 android.sourceSets DSL로 완전히 이전하지 않아
# kotlin.sourceSets로 생성 소스를 등록한다 — AGP가 공식 제공하는 과도기 escape hatch로 억제한다.
# https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false
# v1 무료 배포에는 결제 공개키를 설정하지 않는다.
# 수익화 재개 시 새 Play 앱의 공개키를 -PplayBillingPublicKey로 제공한다.
